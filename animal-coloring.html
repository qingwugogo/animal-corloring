  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    user-select: none;
  }
  h1 {
    font-size: clamp(22px, 4vw, 34px);
    color: #ff6b9d;
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 10px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform .15s;
  }
  h1:hover { transform: scale(1.05); }
  .t-speaker { font-size: .55em; vertical-align: middle; opacity: .75; animation: soundPulse 1.6s ease-in-out infinite; display: inline-block; }
  @keyframes soundPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }
  .nav {
    background: #fff;
    border-radius: 24px;
    padding: 12px 16px 14px;
    box-shadow: 0 6px 18px rgba(110, 90, 160, .12);
    margin-bottom: 14px;
    max-width: 1000px;
    width: 100%;
  }
  .cats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .cat-btn {
    display: flex; align-items: center; gap: 8px;
    border: none; background: #f1f3f5; border-radius: 999px;
    padding: 7px 20px 7px 8px; font-size: 16px; font-family: inherit;
    color: #6b7076; cursor: pointer; transition: all .18s;
  }
  .cat-btn .ico {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; line-height: 1; flex: none;
  }
  .cat-btn:hover { transform: translateY(-2px); }
  .cat-btn.active {
    background: var(--c); color: #fff; font-weight: bold;
    box-shadow: 0 5px 14px var(--c);
  }
  .cat-btn.active .ico { background: rgba(255,255,255,.3); }
  .subs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; width: fit-content; margin: 11px auto 0; border-radius: 999px; padding: 4px 6px; }
  .subs:empty { display: none; }
  .sub-btn {
    border: none; background: transparent; border-radius: 999px;
    padding: 5px 18px; font-size: 14px; font-family: inherit; color: #6b7076;
    cursor: pointer; transition: all .18s;
  }
  .sub-btn:hover { transform: translateY(-1px); }
  .sub-btn.active { background: var(--c); color: #fff; font-weight: bold; box-shadow: 0 3px 9px var(--c); }
  .pics { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 4px 0 16px; width: 100%; max-width: 1000px; }
  .pic-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 3px solid transparent; background: #fff; border-radius: 18px;
    padding: 6px 6px 4px; font-family: inherit; cursor: pointer;
    box-shadow: 0 3px 10px rgba(110, 90, 160, .10);
    transition: all .18s;
    position: relative;
  }
  .pic-btn .spk {
    position: absolute; top: 9px; right: 9px; z-index: 2;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,.88); box-shadow: 0 1px 4px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; cursor: pointer;
    transition: transform .12s;
  }
  .pic-btn .spk:hover { transform: scale(1.2); }
  .pic-btn .thumb { width: 86px; height: 64px; border-radius: 12px; overflow: hidden; background: #fff; pointer-events: none; }
  .pic-btn .thumb svg { width: 86px; height: 64px; display: block; }
  .pic-btn .plabel { font-size: 13px; color: #666; line-height: 1.2; pointer-events: none; }
  .pic-btn:hover { transform: translateY(-3px); }
  .pic-btn.active { border-color: var(--c); box-shadow: 0 5px 14px var(--c); }
  .pic-btn.active .plabel { color: var(--c); font-weight: bold; }
  .main { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: flex-start; width: 100%; max-width: 1100px; }
  .canvas-box {
    background: #fff;
    border-radius: 24px;
    border: 4px solid #d0e7ff;
    box-shadow: 0 8px 20px rgba(80,140,255,.15);
    padding: 10px;
    position: relative;
    flex: 1 1 500px;
    max-width: 680px;
  }
  svg#board { width: 100%; height: auto; display: block; border-radius: 16px; }
  svg#board .rg { cursor: crosshair; transition: fill .12s; }
  .tools {
    flex: 0 1 300px;
    background: #fff;
    border-radius: 24px;
    border: 4px solid #ffe1a8;
    box-shadow: 0 8px 20px rgba(255,180,60,.18);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .current { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #555; }
  #curColor {
    width: 42px; height: 42px; border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 3px #ccc;
    background: #ff6b9d;
  }
  .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .swatch {
    width: 100%; aspect-ratio: 1; border-radius: 50%;
    border: 3px solid rgba(0,0,0,.08);
    cursor: pointer;
    transition: transform .12s;
  }
  .swatch:hover { transform: scale(1.18); }
  .swatch.active { transform: scale(1.18); box-shadow: 0 0 0 3px #555; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tool-btn {
    flex: 1 1 40%;
    border: none;
    border-radius: 14px;
    padding: 10px 8px;
    font-size: 15px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    transition: transform .12s, filter .12s;
  }
  .tool-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  #btnEraser { background: #9aa5b1; }
  #btnEraser.on { background: #ff8787; box-shadow: 0 0 0 3px #ffd0d0; }
  #btnUndo { background: #ffa94d; }
  #btnClear { background: #ff6b6b; }
  #btnSave { background: #51cf66; flex: 1 1 100%; font-size: 17px; }
  #btnSound { background: #748ffc; }
  #btnJoin { background: #9775fa; opacity: .55; flex: 1 1 100%; padding: 7px 8px; font-size: 13px; }
  #btnJoin.on { background: #7048e8; opacity: 1; box-shadow: 0 0 0 3px #e5dbff; }
  .tip { font-size: 13px; color: #999; text-align: center; cursor: pointer; user-select: none; }
  .tip:hover { color: #666; }
  .sparkle {
    position: fixed; pointer-events: none; font-size: 18px;
    animation: pop .7s ease-out forwards; z-index: 99;
  }
  @keyframes pop {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  @media (max-width: 860px) {
    .tools { flex: 1 1 100%; max-width: 680px; }
    .canvas-box { flex: 1 1 100%; }
  }
  @media (max-width: 560px) {
    body { padding: 10px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .nav { padding: 9px 8px 10px; border-radius: 20px; margin-bottom: 10px; }
    .cats { gap: 6px; }
    .cat-btn { padding: 5px 12px 5px 5px; font-size: 14px; gap: 6px; }
    .cat-btn .ico { width: 27px; height: 27px; font-size: 15px; }
    .subs { margin-top: 8px; padding: 3px 4px; }
    .sub-btn { padding: 4px 13px; font-size: 13px; }
    .pics { gap: 7px; margin-bottom: 12px; }
    .pic-btn { border-width: 2px; padding: 4px 4px 3px; border-radius: 14px; }
    .pic-btn .thumb, .pic-btn .thumb svg { width: 66px; height: 50px; }
    .pic-btn .plabel { font-size: 11px; }
    .canvas-box { padding: 6px; border-radius: 20px; }
    .tools { padding: 12px; border-radius: 20px; gap: 10px; }
    .palette { gap: 6px; }
    .current { font-size: 14px; }
    #curColor { width: 34px; height: 34px; }

    .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cat-btn { justify-content: center; padding: 6px 8px; }
  }
</style>
</head>

/* 中英文朗读：先中文后英文，用系统自带的语音合成（防哑火 + 低间隔版） */
let vZh = null, vEn = null, spkTimer = null, spkSeq = 0, spkStartAt = 0;
// 连读模式：中文和英文合成一句读完，中间没有换语音的停顿。默认关闭（双语音发音更标准），
// 只有家长在意节奏时再手动打开
let joinMode = localStorage.getItem("ct_join") === "1";
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  const zh = vs.filter(v => v.lang.toLowerCase().startsWith("zh"));
  const en = vs.filter(v => v.lang.toLowerCase().startsWith("en"));
  // 打分：本地语音优先（联网语音每句都要联网，起播和衔接都慢），Google 网络语音最后考虑
  const pick = (list, lang) => {
    let best = null, bestScore = -1e9;
    list.forEach(v => {
      let s = 0;
      if (v.localService) s += 100;
      if (v.lang.toLowerCase() === lang) s += 30;
      else if (v.lang.toLowerCase().startsWith(lang.split("-")[0])) s += 10;
      if (/google/i.test(v.name) || /google/i.test(v.voiceURI || "")) s -= 60;
      if (s > bestScore) { bestScore = s; best = v; }
    });
    return best;
  };
  vZh = pick(zh, "zh-cn");
  vEn = pick(en, "en-us");
}
function speakZhEn(zh, en) {
  if (!soundOn || !("speechSynthesis" in window)) return;
  try {
    spkSeq++;
    const my = spkSeq;
    clearTimeout(spkTimer);
    // 只有真在播放时才打断。以前每次点击都 cancel+resume，等于让引擎重新初始化，
    // 换语言时那一下停顿会被放得更大。
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if (busy) {
      speechSynthesis.cancel();
      if (speechSynthesis.paused) speechSynthesis.resume();
    }
    const go = () => {
      if (my !== spkSeq) return;
      // 连读只用于单词/短语；成句的英文（底部提示等）仍交给英文发音人，避免中文音硬读英文句子变怪音
      if (joinMode && vZh && en.length <= 24) {
        const u = new SpeechSynthesisUtterance(zh + "，" + en);
        u.lang = "zh-CN"; u.rate = 1.05;
        u.voice = vZh;
        u.onstart = () => { if (my === spkSeq) spkStartAt = Date.now(); };
        speechSynthesis.speak(u);
        return;
      }
      const uz = new SpeechSynthesisUtterance(zh);
      uz.lang = "zh-CN"; uz.rate = 1.2;
      if (vZh) uz.voice = vZh;
      uz.onstart = () => { if (my === spkSeq) spkStartAt = Date.now(); };
      const ue = new SpeechSynthesisUtterance(en);
      ue.lang = "en-US"; ue.rate = 1.1;
      if (vEn) ue.voice = vEn;
      // 两句同队列无缝衔接（这是换语音条件下能做到的最小间隔）
      speechSynthesis.speak(uz);
      speechSynthesis.speak(ue);
    };
    // 只在刚打断过时才需要延后一帧，空闲时立刻出声，省掉固定延迟
    if (busy) spkTimer = setTimeout(go, 30); else go();
  } catch (e) { /* 朗读失败不影响游戏 */ }
}
// 兜底 watchdog：若引擎卡死（一句短语 12 秒还没结束），强制 cancel+resume 复位，
// 下一次点击就能恢复正常发声
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
  setInterval(() => {
    try {
      if (speechSynthesis.speaking && spkStartAt && Date.now() - spkStartAt > 12000) {
        speechSynthesis.cancel();
        speechSynthesis.resume();
        spkStartAt = 0;
      }
    } catch (e) {}
  }, 2000);
}
// 首次交互时唤醒音频会话（真实手势内调用，安全且无卡死风险），首句朗读更快出声
let _audioWoke = false;
document.addEventListener("pointerdown", () => {
  if (_audioWoke) return;
  _audioWoke = true;
  try { speechSynthesis.resume(); } catch (e) {}
}, { capture: true });

  "🦕 长颈龙": ["animal", "远古动物"], "🦖 霸王龙": ["animal", "远古动物"], "🦏 三角龙": ["animal", "远古动物"],
  "🦣 猛犸象": ["animal", "远古动物"], "🦎 剑龙": ["animal", "远古动物"], "🦅 翼龙": ["animal", "远古动物"],
  "🍉 大西瓜": ["plant", "水果"], "🍓 小草莓": ["plant", "水果"], "🍍 大菠萝": ["plant", "水果"],

  "🥦 西兰花": ["plant", "蔬菜"], "🌽 玉米": ["plant", "蔬菜"], "🍆 茄子": ["plant", "蔬菜"],
  "🌻 向日葵": ["plant", "花草"], "🌵 小仙人掌": ["plant", "花草"], "🌷 郁金香": ["plant", "花草"],
  "🌹 玫瑰花": ["plant", "花草"], "🌳 大树": ["plant", "花草"], "🪴 小盆栽": ["plant", "花草"],
  "🚗 小汽车": ["vehicle", ""], "🚂 小火车": ["vehicle", ""], "✈️ 大飞机": ["vehicle", ""], "🚢 大轮船": ["vehicle", ""],
  "🚌 公交车": ["vehicle", ""], "🚁 直升机": ["vehicle", ""],
  "🏠 小房子": ["building", ""], "🧸 幼儿园": ["building", ""], "🏫 小学": ["building", ""],
  "🏬 大商场": ["building", ""], "🏢 剖面小楼": ["building", ""], "🔬 海底基地": ["building", ""],
  "🗺️ 宝藏岛": ["building", ""]
};

PICTURES.forEach(p => {
  const m = CAT_OF[p.name] || ["animal", "小动物"];
  p.cat = m[0]; p.sub = m[1];
});

const catsEl = document.getElementById("cats");
const subsEl = document.getElementById("subs");
let curCat = "animal", curSub = "小动物", curIdx = 0;

function renderNav() {
  catsEl.innerHTML = "";
  subsEl.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat-btn" + (c.id === curCat ? " active" : "");
    b.style.setProperty("--c", c.color);
    const ico = document.createElement("span");
    ico.className = "ico";
    ico.textContent = c.icon;
    ico.style.background = c.id === curCat ? "rgba(255,255,255,.3)" : c.color + "26";
    const lb = document.createElement("span");
    lb.textContent = c.label;
    b.appendChild(ico); b.appendChild(lb);
    b.onclick = () => {
      curCat = c.id;
      curSub = c.subs.length ? c.subs[0] : "";
      renderNav();
      speakZhEn(c.label, c.en);
    };
    catsEl.appendChild(b);
  });
  const cat = CATS.find(c => c.id === curCat);
  subsEl.style.background = cat ? cat.color + "14" : "transparent";
  if (cat && cat.subs.length) {
    cat.subs.forEach(s => {
      const b = document.createElement("button");
      b.className = "sub-btn" + (s === curSub ? " active" : "");
      b.style.setProperty("--c", cat.color);
      b.textContent = s;
      b.onclick = () => { curSub = s; renderNav(); speakZhEn(s, SUB_EN[s] || s); };
      subsEl.appendChild(b);
    });
  }
  // 若当前选中的图案不在新分类里，自动跳到该分类第一张
  const cur = PICTURES[curIdx];
  if (!cur || cur.cat !== curCat || (curSub && cur.sub !== curSub)) {
    curIdx = PICTURES.findIndex(p => p.cat === curCat && (!curSub || p.sub === curSub));
    if (curIdx >= 0) loadPicture(curIdx);
  }
  renderPics();
}

function renderPics() {
  picsEl.innerHTML = "";
  const color = (CATS.find(c => c.id === curCat) || {}).color || "#ff6b9d";
  PICTURES.forEach((p, i) => {
    if (p.cat !== curCat) return;
    if (curSub && p.sub !== curSub) return;
    const b = document.createElement("button");
    b.className = "pic-btn" + (i === curIdx ? " active" : "");
    b.style.setProperty("--c", color);
    b.innerHTML = '<span class="thumb"><svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' + p.svg + '</svg></span>'
                + '<span class="plabel">' + p.name + '</span>'
                + '<span class="spk" title="听读音">🔊</span>';
    const zh = p.name.replace(/^\S+\s*/, "");
    const en = PIC_EN[zh] || zh;
    b.querySelector(".spk").onclick = (ev) => {
      ev.stopPropagation();
      speakZhEn(zh, en);
    };
    b.onclick = () => {
      curIdx = i; loadPicture(i); renderPics();
      speakZhEn(zh, en);
    };
    picsEl.appendChild(b);
  });
}

COLORS.forEach(([hex, name, en]) => {
  const s = document.createElement("div");
  s.className = "swatch";
  s.style.background = hex;
  s.title = name + " " + en;
  s.onclick = () => {
    color = hex; colorName = name;
    eraser = false; btnEraser.classList.remove("on");
    curColorEl.style.background = hex;
    curColorEl.style.boxShadow = "0 0 0 3px #ccc";
    curNameEl.textContent = name;
    document.querySelectorAll(".swatch").forEach(x => x.classList.remove("active"));
    s.classList.add("active");
    speakZhEn(name, en);
  };
  if (hex === "#ff6b9d") s.classList.add("active");
  paletteEl.appendChild(s);
});

function loadPicture(i) {
  board.innerHTML = PICTURES[i].svg + "</svg>";
  undoStack = [];
  board.querySelectorAll(".rg").forEach(el => {
    el.dataset.def = el.getAttribute("fill") || "#ffffff";
    el.addEventListener("click", onFill);
  });
}

/* ============ 涂色 ============ */
function onFill(e) {
  const el = e.currentTarget;
  const from = el.getAttribute("fill");
  const to = eraser ? el.dataset.def : color;
  if (from === to) return;
  el.setAttribute("fill", to);
  undoStack.push([{ el, from }]);
  if (soundOn) popSound();
  sparkle(e.clientX, e.clientY);
  if (eraser) speakZhEn("橡皮擦", "Eraser");
  else {
    const c = COLORS.find(x => x[0] === color);
    speakZhEn(colorName, c ? c[2] : colorName);
  }
}

/* ============ 工具按钮 ============ */
btnEraser.onclick = () => {
  eraser = !eraser;
  btnEraser.classList.toggle("on", eraser);
  curColorEl.style.background = eraser ? "repeating-linear-gradient(45deg,#eee 0 6px,#ccc 6px 12px)" : color;
  curNameEl.textContent = eraser ? "橡皮擦" : colorName;
  eraser ? speakZhEn("橡皮擦", "Eraser") : speakZhEn("画笔", "Paint brush");
};
document.getElementById("btnUndo").onclick = () => {
  const batch = undoStack.pop();
  if (batch) batch.forEach(({ el, from }) => el.setAttribute("fill", from));
  speakZhEn("撤销", "Undo");
};
document.getElementById("btnClear").onclick = () => {
  const batch = [];
  board.querySelectorAll(".rg").forEach(el => {
    const from = el.getAttribute("fill");
    if (from !== el.dataset.def) { batch.push({ el, from }); el.setAttribute("fill", el.dataset.def); }
  });
  if (batch.length) undoStack.push(batch);
  speakZhEn("全部重来", "Clear all");
};
document.getElementById("btnSound").onclick = function () {
  // 关闭前先把提示念完，再静音；打开时直接念
  if (soundOn) speakZhEn("声音关", "Sound off");
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔊 声音开" : "🔇 声音关";
  if (soundOn) setTimeout(() => speakZhEn("声音开", "Sound on"), 300);
};
const btnJoin = document.getElementById("btnJoin");
btnJoin.classList.toggle("on", joinMode);
btnJoin.onclick = () => {
  joinMode = !joinMode;
  localStorage.setItem("ct_join", joinMode ? "1" : "0");
  btnJoin.classList.toggle("on", joinMode);
  speakZhEn(joinMode ? "连读开" : "双语音", joinMode ? "Joined" : "Two voices");
};
document.getElementById("btnSave").onclick = () => {
  speakZhEn("保存我的画", "Save my picture");
  const clone = board.cloneNode(true);
  const data = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = 1200; c.height = 900;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 1200, 900);
    ctx.drawImage(img, 0, 0, 1200, 900);
    const a = document.createElement("a");
    a.download = "我的涂色作品.png";
    a.href = c.toDataURL("image/png");
    a.click();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data);
};

/* ============ 音效 & 特效 ============ */
function popSound() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(600 + Math.random() * 300, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.16);
  } catch (e) {}
}
function sparkle(x, y) {
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("span");
    s.className = "sparkle";
    s.textContent = Math.random() < 0.5 ? "✨" : "💫";
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
    s.style.setProperty("--dy", (-30 - Math.random() * 40) + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}

loadPicture(0);
renderNav();
